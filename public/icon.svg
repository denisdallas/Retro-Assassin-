<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Cyber ninja helmet / shadow mask with glowing eyes and dual katanas -->
  <g filter="url(#neonGlow)">
    <!-- Crossed Cyber Daggers -->
    <path d="M 120 120 L 392 392 M 392 120 L 120 392" stroke="#ff0055" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <!-- Cyber Mask Outline -->
    <polygon points="256,90 370,160 350,320 256,410 162,320 142,160" fill="#090d16" stroke="url(#cyberNeon)" stroke-width="14" stroke-linejoin="round"/>
    <!-- Cyber Visor / Eyes -->
    <path d="M 180 230 L 240 250 L 256 242 L 272 250 L 332 230" fill="none" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Visor Core Glow -->
    <circle cx="210" cy="238" r="7" fill="#ffffff" />
    <circle cx="302" cy="238" r="7" fill="#ffffff" />
    <!-- Cyber Forehead Insignia -->
    <polygon points="256,130 276,170 236,170" fill="#00f0ff"/>
    <!-- Lower Mask Vent Slits -->
    <path d="M 220 310 L 292 310 M 230 334 L 282 334 M 242 356 L 270 356" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
